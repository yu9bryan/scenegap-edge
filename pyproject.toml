[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenegap-edge"
version = "0.1.0"
description = "Local-first shot coverage and reshoot assistant (requirement -> evidence -> decision)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "av>=12", "pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8", "httpx>=0.27", "imageio-ffmpeg>=0.5"]

[project.scripts]
scenegap = "scenegap.__main__:main"

[tool.setuptools.packages.find]
include = ["scenegap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
