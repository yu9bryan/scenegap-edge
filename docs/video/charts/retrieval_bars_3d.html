<!doctype html><html><head><meta charset="utf-8"><title>3D chart sample v5</title>
<style>html,body{margin:0;height:100%;background:#0B0B12;font-family:Arial;overflow:hidden}
canvas{position:absolute;left:0;top:0}
.t{position:absolute;left:110px;top:70px;color:#F3F1FF;z-index:2}.t b{display:block;font-size:54px;margin-top:10px}.t span{color:#22D3EE;font-size:22px;letter-spacing:3px}
.k{position:absolute;right:110px;top:92px;display:flex;gap:28px;color:#E9E5FF;font-size:24px;z-index:2}.k i{display:inline-block;width:22px;height:22px;margin-right:10px;vertical-align:-3px;opacity:.85}
.n{position:absolute;left:110px;bottom:46px;color:#9CA3AF;font-size:20px;z-index:2}
.v{position:absolute;transform:translate(-50%,-100%);color:#fff;font-weight:bold;font-size:30px;z-index:2;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.g{position:absolute;transform:translate(-50%,0);color:#E9E5FF;font-size:26px;z-index:2;white-space:nowrap;letter-spacing:.5px}

<div class="t"><span>HELD-OUT TEST · SCORED ONCE</span><b>Finding the right clip in the top 5</b></div>
<div class="k"><div><i style="background:#22D3EE"></i>Recall@5</div><div><i style="background:#8B78FF"></i>Precision@5</div></div>
<div class="n">26 Commons clips, 11 shots · desktop GPU, CLIP ViT-B/32 · eval/results/test_metrics.json</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const GROUPS = [{"name": "Title keywords", "r": 45, "p": 36}, {"name": "Single-frame search", "r": 73, "p": 40}, {"name": "SceneGap", "r": 64, "p": 33}];
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1); renderer.setSize(W,H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0B0B12');
scene.fog = new THREE.Fog('#0B0B12', 26, 48);
const cam = new THREE.PerspectiveCamera(20, W/H, 0.1, 300);
// lights
scene.add(new THREE.HemisphereLight('#c9c4ff', '#0B0B12', 0.55));
const key = new THREE.DirectionalLight('#ffffff', 1.6); key.position.set(-6, 14, 9); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-14; key.shadow.camera.right=14; key.shadow.camera.top=14; key.shadow.camera.bottom=-14; key.shadow.radius=6; key.shadow.bias=-0.0002; key.shadow.normalBias=0.035;
scene.add(key);
const rim = new THREE.DirectionalLight('#22D3EE', 0.5); rim.position.set(8, 5, -8); scene.add(rim);
// floor + faint grid
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshStandardMaterial({color:'#12121b', roughness:0.9, metalness:0}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
// soft pool of light on the floor under the chart instead of grid lines (lines showed through the glass bars)
const pc = document.createElement('canvas'); pc.width = pc.height = 512; const px = pc.getContext('2d');
const rg = px.createRadialGradient(256, 256, 0, 256, 256, 256); rg.addColorStop(0, 'rgba(120,110,220,0.32)'); rg.addColorStop(0.55, 'rgba(60,60,120,0.12)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
px.fillStyle = rg; px.fillRect(0, 0, 512, 512);
const pool = new THREE.Mesh(new THREE.PlaneGeometry(30, 14), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(pc), transparent:true, depthWrite:false}));
pool.material.polygonOffset = true; pool.material.polygonOffsetFactor = -1; pool.material.polygonOffsetUnits = -4;
pool.rotation.x = -Math.PI/2; pool.position.y = 0.01; pool.renderOrder = 1; scene.add(pool);
// bars on plinths
const COL = ['#22D3EE', '#8B78FF'];
// vertical gradients: colour (dark bottom -> bright top) and alpha (more see-through at the bottom)
const GRAD = [['#0B5566', '#2FD9F2', '#A5F3FC'], ['#3B1F8F', '#8B78FF', '#DDD6FE']];
function gradTex(stops, alpha){
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 256, 0, 0);                    // bottom -> top
  if (alpha) { g.addColorStop(0, '#a6a6a6'); g.addColorStop(1, '#ebebeb'); }   // alpha 0.65 -> 0.92 (green channel)
  else { g.addColorStop(0, stops[0]); g.addColorStop(0.6, stops[1]); g.addColorStop(1, stops[2]); }
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); if (!alpha) t.colorSpace = THREE.SRGBColorSpace; return t;
}
const ALPHA = gradTex(null, true);
const gap = 5.2, barW = 1.25, inner = 0.35, maxH = 6.0, plinthH = 0.22;
const bars = [], labels = [], groupLabels = [];
GROUPS.forEach((g, i) => {
  const x = (i - 1) * gap;
  const hl = g.name === 'SceneGap';
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(barW*2 + inner + 1.0, plinthH, barW + 1.0),
    new THREE.MeshStandardMaterial({color:'#1d1d2b', roughness:0.5, metalness:0.2}));
  plinth.position.set(x, plinthH/2, 0); plinth.castShadow = true; plinth.receiveShadow = true; scene.add(plinth);
  const pe = new THREE.LineSegments(new THREE.EdgesGeometry(plinth.geometry), new THREE.LineBasicMaterial({color:'#4a4a66'}));
  pe.position.copy(plinth.position); scene.add(pe);
  [g.r, g.p].forEach((v, j) => {
    const h = maxH * v / 100;
    const geo = new THREE.BoxGeometry(barW, 1, barW); geo.translate(0, 0.5, 0);
    const tex = gradTex(GRAD[j], false);
    const mat = new THREE.MeshPhysicalMaterial({color:'#ffffff', map: tex, alphaMap: ALPHA, transparent:true, opacity:1, depthWrite:false,
      roughness:0.2, metalness:0.0, clearcoat:0.7, emissive:'#ffffff', emissiveMap: tex, emissiveIntensity:0.35, side: THREE.DoubleSide});
    // BoxGeometry face order: +x, -x, +y (top), -y (bottom), +z, -z; the top gets a solid bright cap
    const cap = new THREE.MeshPhysicalMaterial({color: GRAD[j][2], transparent:true, opacity:0.95, roughness:0.15, clearcoat:0.8,
      emissive: GRAD[j][2], emissiveIntensity:0.45, depthWrite:false});
    const hidden = new THREE.MeshBasicMaterial({visible:false});          // bottom face sits on the plinth: never drawn
    const m = new THREE.Mesh(geo, [mat, mat, cap, hidden, mat, mat]); m.castShadow = true;
    m.renderOrder = 10 + i * 2 + j;                                       // fixed draw order: no swapping while the camera sways
    m.position.set(x + (j ? 1 : -1) * (barW + inner)/2, plinthH + 0.02, 0); m.scale.y = 0.001; scene.add(m);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:'#ffffff', transparent:true, opacity:0.4}));
    edges.renderOrder = 30;
    m.add(edges);
    bars.push({m, h, delay: 0.3 + i*0.28 + j*0.14});
    const el = document.createElement('div'); el.className = 'v'; el.textContent = v + '%'; el.style.opacity = 0; document.body.appendChild(el);
    labels.push({el, m});
  });
  const gl = document.createElement('div'); gl.className = 'g' + (hl ? ' hl' : ''); gl.textContent = g.name; document.body.appendChild(gl);
  groupLabels.push({el: gl, pos: new THREE.Vector3(x, 0, (barW + 1.0)/2 + 0.6)});
});
// ease-in-out (cubic): slow start, smooth middle, gentle stop; no jump off the plinth
const ease = t => { t = Math.min(Math.max(t,0),1); return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; };
const target = new THREE.Vector3(0, 2.4, 0);
const t0 = performance.now();
const GROW = 2.4;
function proj(v){ const p = v.clone().project(cam); return [(p.x+1)/2*W, (1-p.y)/2*H]; }
function drawAt(t){
  const a = 0.14 * Math.sin(t * 0.3);                    // gentle sway around the centre, about ±8 degrees
  cam.position.set(Math.sin(a) * 30, 10.5, Math.cos(a) * 30); cam.lookAt(target);
  for (const b of bars) { const k = ease((t - b.delay) / GROW); b.m.scale.y = Math.max(0.001, b.h * k); }
  labels.forEach((L, i) => { const top = new THREE.Vector3(); L.m.getWorldPosition(top); top.y += L.m.scale.y + 0.25;
    const [x, y] = proj(top); L.el.style.left = x + 'px'; L.el.style.top = y + 'px';
    L.el.style.opacity = Math.min(1, Math.max(0, (t - bars[i].delay - GROW + 0.3) / 0.5)); });
  groupLabels.forEach(G => { const [x, y] = proj(G.pos); G.el.style.left = x + 'px'; G.el.style.top = y + 'px'; });
  renderer.render(scene, cam);
}
window.renderAt = t => { drawAt(t); return true; };
if (location.search.includes('live')) { const loop = now => { drawAt((now - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
else { drawAt(0); window.chartReady = true; }
</script></body></html>
